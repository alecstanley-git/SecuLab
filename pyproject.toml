[project]
name = "seculab"
version = "0.1.0"
description = "Integrates the secular equations of motion of hierarchical triple and quadruple systems, with short-range forces, tides and GW emission."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rebound>=5.2.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
